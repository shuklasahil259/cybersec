<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04100c"/>
      <stop offset="1" stop-color="#071822"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e18f"/>
      <stop offset="0.6" stop-color="#2ad4ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#00e18f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e18f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#2ad4ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#7dffc8" stroke-opacity="0.05">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M90 0 V630 M180 0 V630 M270 0 V630 M360 0 V630 M450 0 V630 M540 0 V630 M630 0 V630 M720 0 V630 M810 0 V630 M900 0 V630 M990 0 V630 M1080 0 V630 M1170 0 V630"/>
  </g>

  <circle cx="1050" cy="90" r="330" fill="url(#glow1)"/>
  <circle cx="150" cy="560" r="380" fill="url(#glow2)"/>

  <!-- shield node -->
  <g transform="translate(150,150)">
    <rect width="260" height="320" rx="24" fill="#06131c" stroke="#00e18f" stroke-opacity="0.5"/>
    <text x="130" y="150" font-family="Consolas, Menlo, monospace" font-size="64" font-weight="700" text-anchor="middle" fill="#00e18f">&gt;_</text>
    <text x="130" y="212" font-family="Consolas, Menlo, monospace" font-size="22" letter-spacing="6" text-anchor="middle" fill="#2ad4ff">CYBERSEC</text>
  </g>

  <text x="470" y="196" font-family="Consolas, Menlo, monospace" font-size="30" letter-spacing="2" fill="#748e87">cybersecurity student portfolio</text>
  <text x="468" y="300" font-family="Arial, Segoe UI, sans-serif" font-size="86" font-weight="800" fill="#e6f2ee">Security-focused</text>
  <text x="468" y="398" font-family="Arial, Segoe UI, sans-serif" font-size="86" font-weight="800" fill="url(#accent)">by design.</text>
  <text x="472" y="480" font-family="Arial, Segoe UI, sans-serif" font-size="30" fill="#a8c2ba">Learning ethical hacking, Linux, networking, SOC &amp; cloud security — one lab at a time.</text>
</svg>
